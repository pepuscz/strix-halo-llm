<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 775" role="img" aria-labelledby="title desc">
<title id="title">Dual RX 7900 XTX throughput: GLM-5.3-Flash and DeepSeek-V4.1-Flash-1017</title>
<desc id="desc">Cold five-phrase retrieval on two RX 7900 XTX cards with a Radeon 8060S expert helper, the same prompt bytes for both models. GLM-5.3-Flash: twelve fresh loads, from 1886 to 456403 of its tokens, at 131072-, 262144- and 524288-token capacity. DeepSeek-V4.1-Flash-1017: ten fresh loads at 262144-token capacity, from 2040 to 245760 of its tokens. Every answer found all five phrases. Each horizontal tick doubles the input length.</desc>
