<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 775" role="img" aria-labelledby="title desc">
<title id="title">DeepSeek-V4.1-Flash-1017: dual RX 7900 XTX throughput</title>
<desc id="desc">Cold five-phrase retrieval on two RX 7900 XTX cards with a Radeon 8060S expert helper. Ten fresh loads at 262144-token capacity, from 2040 to 245760 input tokens; every answer found all five phrases. Each answer used 64 tokens. Each horizontal tick doubles the input length.</desc>
