<title id="title">One RX 7900 XTX throughput: DeepSeek-V4.1-Flash-1017</title>
<desc id="desc">Cold five-phrase retrieval with one RX 7900 XTX and the Radeon 8060S as the expert helper, against the same EXL3 2.25 bpw model and engine on two cards. Both use a 1,048,576-token allocation and the same prompt bytes; every point found all five phrases. Each horizontal tick doubles the input length.</desc>
