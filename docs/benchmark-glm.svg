<title id="title">GLM-5.3-Flash throughput</title>
<desc id="desc">Reading and answer-writing speeds of GLM-5.3-Flash on the BOSGAME M5 (Ryzen AI Max+ 395, Radeon 8060S, 128 GiB RAM) with two RX 7900 XTX cards. The test asks the model to find five labelled phrases placed in a long text. Every run found all five correctly. Each point measures one request at the input length shown. Each horizontal tick doubles the input length.</desc>
