name: Ansible

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install frozen controller requirements
        run: pip install --require-hashes -r requirements.lock
      - name: Lint Ansible
        run: ansible-lint ansible
      - name: Validate release pins and public-data boundary
        shell: bash
        run: |
          set -euo pipefail
          for release in ansible/releases/*.yml; do
            python scripts/validate_release.py "$release"
          done
      - name: Verify generated benchmark chart
        run: python scripts/render_benchmark.py --check
      - name: Test demand-based fan governor
        run: python -m unittest tests/test_fan_governor.py
      - name: Assert the qualified release set
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'STRIX_SYSTEM:-strata-qwen-q4xl' bin/strixctl
          test -f ansible/releases/vulkan-iq3xxs-512k.yml
          test -f ansible/releases/rocm-rocmfpx-128k.yml
          test -f ansible/releases/strata-qwen-q4xl-4x256k.yml
          test "$(find ansible/releases -maxdepth 1 -type f -name '*.yml' | wc -l)" -eq 3
      - name: Render and inspect every service contract
        shell: bash
        run: |
          set -euo pipefail
          for release in ansible/releases/*.yml; do
            ansible-playbook -i localhost, -c local -e "@$release" tests/render.yml
          done
      - name: Syntax-check every playbook
        shell: bash
        run: |
          set -euo pipefail
          for release in ansible/releases/*.yml; do
            for playbook in ansible/playbooks/*.yml; do
              ansible-playbook --syntax-check \
                -i ansible/inventory/hosts.example.yml \
                -e "@$release" \
                "$playbook"
            done
          done
