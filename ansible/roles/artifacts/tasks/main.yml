---
- name: Create immutable artifact directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ strix_service.group }}"
    mode: "0755"
  loop:
    - "{{ strix_paths.downloads }}"
    - "{{ strix_paths.release }}"
    - "{{ strix_paths.models }}"

- name: Install resumable verified artifact fetcher
  ansible.builtin.template:
    src: fetch-verified-artifact.j2
    dest: "{{ strix_paths.bin }}/fetch-verified-artifact"
    owner: root
    group: root
    mode: "0755"

- name: Define pinned model artifacts
  ansible.builtin.set_fact:
    artifacts_model_artifacts: >-
      {{
        strix_target.files | map('combine', {
          'kind': 'target',
          'repository': strix_target.repository,
          'revision': strix_target.revision,
          'subdirectory': strix_target.subdirectory
        }) | list
        + ([] if strix_system.engine == 'strata' else [strix_draft | combine({'kind': 'draft'})])
      }}

- name: Fetch or adopt every pinned model artifact
  ansible.builtin.command:
    argv:
      - "{{ strix_paths.bin }}/fetch-verified-artifact"
      - "{{ artifacts_url }}"
      - "{{ strix_paths.models }}/{{ item.name }}"
      - "{{ item.size }}"
      - "{{ item.sha256 }}"
      - "{{ (strix_artifact_seed_paths | default({}))[item.name] | default('') }}"
  loop: "{{ artifacts_model_artifacts }}"
  loop_control:
    label: "{{ item.name }}"
  register: artifacts_model_fetch
  changed_when: "'downloaded' in artifacts_model_fetch.stdout or 'adopted' in artifacts_model_fetch.stdout"
  async: 86400
  poll: 30
  vars:
    artifacts_relative_path: >-
      {{ (item.subdirectory + '/') if item.subdirectory | length > 0 else '' }}{{ item.name }}
    artifacts_url: >-
      https://huggingface.co/{{ item.repository }}/resolve/{{ item.revision }}/{{ artifacts_relative_path }}?download=true

- name: Read model artifact sizes
  ansible.builtin.stat:
    path: "{{ strix_paths.models }}/{{ item.name }}"
    get_checksum: false
  loop: "{{ artifacts_model_artifacts }}"
  loop_control:
    label: "{{ item.name }}"
  register: artifacts_model_sizes

- name: Assert model artifact sizes
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.size | int == item.item.size | int
    fail_msg: "Model artifact size failed for {{ item.item.name }}."
  loop: "{{ artifacts_model_sizes.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Verify complete model hashes when requested
  ansible.builtin.stat:
    path: "{{ strix_paths.models }}/{{ item.name }}"
    checksum_algorithm: sha256
    get_checksum: true
  loop: "{{ artifacts_model_artifacts }}"
  loop_control:
    label: "{{ item.name }}"
  register: artifacts_model_hashes
  when: strix_verify_full_model_hashes | bool

- name: Assert requested complete model hashes
  ansible.builtin.assert:
    that:
      - item.stat.checksum == item.item.sha256
  loop: "{{ artifacts_model_hashes.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('skipped') }}"
  when:
    - strix_verify_full_model_hashes | bool
    - not item.skipped | default(false)

- name: Install the Vulkan runtime
  ansible.builtin.include_tasks: vulkan.yml
  when: strix_system.engine == 'vulkan'

- name: Record release artifact provenance
  ansible.builtin.template:
    src: artifacts.yml.j2
    dest: "{{ strix_paths.release }}/ARTIFACTS.yml"
    owner: root
    group: "{{ strix_service.group }}"
    mode: "0444"
