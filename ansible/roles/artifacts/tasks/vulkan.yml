---
- name: Fetch or adopt the pinned runtime archive
  ansible.builtin.command:
    argv:
      - "{{ strix_paths.bin }}/fetch-verified-artifact"
      - "{{ strix_runtime.archive_url }}"
      - "{{ strix_paths.downloads }}/{{ strix_runtime.archive_name }}"
      - "{{ strix_runtime.archive_size }}"
      - "{{ strix_runtime.archive_sha256 }}"
      - "{{ strix_runtime_archive_seed_path | default('') }}"
  register: artifacts_runtime_fetch
  changed_when: "'downloaded' in artifacts_runtime_fetch.stdout or 'adopted' in artifacts_runtime_fetch.stdout"
  async: 86400
  poll: 30

- name: Fetch or adopt the pinned runtime manifest
  ansible.builtin.command:
    argv:
      - "{{ strix_paths.bin }}/fetch-verified-artifact"
      - "{{ strix_runtime.manifest_url }}"
      - "{{ strix_paths.downloads }}/{{ strix_runtime.manifest_name }}"
      - "{{ strix_runtime.manifest_size }}"
      - "{{ strix_runtime.manifest_sha256 }}"
      - "{{ strix_runtime_manifest_seed_path | default('') }}"
  register: artifacts_manifest_fetch
  changed_when: "'downloaded' in artifacts_manifest_fetch.stdout or 'adopted' in artifacts_manifest_fetch.stdout"

- name: Fetch or adopt the pinned Vulkan loader package
  ansible.builtin.command:
    argv:
      - "{{ strix_paths.bin }}/fetch-verified-artifact"
      - "{{ strix_vulkan_loader.url }}"
      - "{{ strix_paths.downloads }}/libvulkan1_{{ strix_vulkan_loader.version }}_{{ strix_vulkan_loader.architecture }}.deb"
      - "{{ strix_vulkan_loader.size }}"
      - "{{ strix_vulkan_loader.sha256 }}"
      - "{{ strix_vulkan_loader_seed_path | default('') }}"
  register: artifacts_loader_fetch
  changed_when: "'downloaded' in artifacts_loader_fetch.stdout or 'adopted' in artifacts_loader_fetch.stdout"

- name: Inspect extracted runtime launcher
  ansible.builtin.stat:
    path: "{{ strix_paths.release }}/vulkan/_run"
    checksum_algorithm: sha256
    get_checksum: true
  register: artifacts_runtime_launcher_before

- name: Inspect extracted Vulkan backend
  ansible.builtin.stat:
    path: "{{ strix_paths.release }}/vulkan/bin/libggml-vulkan.so.0.20.1"
    checksum_algorithm: sha256
    get_checksum: true
  register: artifacts_vulkan_backend_before

- name: Refuse an unrecognized runtime in the immutable release directory
  ansible.builtin.fail:
    msg: >-
      {{ strix_paths.release }} contains an unrecognized runtime. Select a new
      release_id; immutable releases are not overwritten.
  when:
    - artifacts_runtime_launcher_before.stat.exists
    - artifacts_runtime_launcher_before.stat.checksum != strix_runtime.launcher_sha256

- name: Refuse an unrecognized Vulkan backend in the immutable release directory
  ansible.builtin.fail:
    msg: >-
      {{ strix_paths.release }} contains an unrecognized Vulkan backend.
      Select a new release_id; immutable releases are not overwritten.
  when:
    - artifacts_vulkan_backend_before.stat.exists
    - artifacts_vulkan_backend_before.stat.checksum != strix_runtime.vulkan_backend_sha256

- name: Extract the verified portable runtime once
  ansible.builtin.unarchive:
    src: "{{ strix_paths.downloads }}/{{ strix_runtime.archive_name }}"
    dest: "{{ strix_paths.release }}"
    remote_src: true
    owner: root
    group: "{{ strix_service.group }}"
    creates: "{{ strix_paths.release }}/vulkan/_run"
  when: not artifacts_runtime_launcher_before.stat.exists

- name: Extract the pinned Vulkan loader
  ansible.builtin.command:
    argv:
      - dpkg-deb
      - -x
      - "{{ strix_paths.downloads }}/libvulkan1_{{ strix_vulkan_loader.version }}_{{ strix_vulkan_loader.architecture }}.deb"
      - "{{ strix_paths.release }}/loader"
  args:
    creates: "{{ strix_paths.release }}/loader/usr/lib/x86_64-linux-gnu/libvulkan.so.1"

- name: Read pinned Vulkan runtime identities
  ansible.builtin.stat:
    path: "{{ item.path }}"
    checksum_algorithm: sha256
    get_checksum: true
    follow: true
  loop:
    - {name: launcher, path: "{{ strix_paths.release }}/vulkan/_run", sha256: "{{ strix_runtime.launcher_sha256 }}"}
    - {name: runtime-manifest, path: "{{ strix_paths.downloads }}/{{ strix_runtime.manifest_name }}", sha256: "{{ strix_runtime.manifest_sha256 }}"}
    - {name: server-wrapper, path: "{{ strix_paths.release }}/vulkan/llama-server", sha256: "{{ strix_runtime.launcher_sha256 }}"}
    - {name: server, path: "{{ strix_paths.release }}/vulkan/bin/llama-server", sha256: "{{ strix_runtime.server_sha256 }}"}
    - name: vulkan-backend
      path: "{{ strix_paths.release }}/vulkan/bin/libggml-vulkan.so.0.20.1"
      sha256: "{{ strix_runtime.vulkan_backend_sha256 }}"
    - name: vulkan-loader
      path: "{{ strix_paths.release }}/loader/usr/lib/x86_64-linux-gnu/libvulkan.so.1"
      sha256: "{{ strix_vulkan_loader.library_sha256 }}"
  loop_control:
    label: "{{ item.name }}"
  register: artifacts_runtime_identities

- name: Assert pinned Vulkan runtime identities
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.checksum == item.item.sha256
    fail_msg: "Runtime identity failed for {{ item.item.name }}."
  loop: "{{ artifacts_runtime_identities.results }}"
  loop_control:
    label: "{{ item.item.name }}"
