---
- name: Install the qualified Strata serving configuration
  ansible.builtin.template:
    src: strata-server.json.j2
    dest: "{{ strix_paths.release }}/server.json"
    owner: root
    group: "{{ strix_service.group }}"
    mode: "0444"
  when: strix_system.engine == 'strata'
  register: service_strata_config
  notify: Restart selected model service

- name: Seal the installed Strata serving configuration
  ansible.builtin.shell: |
    set -o pipefail
    sha256sum server.json > server.sha256
  args:
    chdir: "{{ strix_paths.release }}"
    executable: /bin/bash
  when:
    - strix_system.engine == 'strata'
    - service_strata_config.changed
  changed_when: true

- name: Install the Strata runtime entry point
  ansible.builtin.template:
    src: run-strata.j2
    dest: "{{ strix_paths.bin }}/run-strata"
    owner: root
    group: root
    mode: "0755"
  when: strix_system.engine == 'strata'
  notify: Restart selected model service

# A release qualified on one card of several (strix_maya.gpu_from_topology): the engine's GPU numbers are the KFD
# topology's order, which depends on the host - the card (the first of its kind, or strix_xtx_pci "bb:dd.f" on a host
# with more) and the Radeon 8060S are looked up there, in the order of the release's `gpu`.
- name: Find the release's card and the Radeon 8060S among the engine's GPUs
  ansible.builtin.shell: |
    set -o pipefail
    want_bdf={{ strix_xtx_pci | default('') | quote }}
    i=0; card=; apu=
    for n in $(ls /sys/class/kfd/kfd/topology/nodes | sort -n); do
      d=/sys/class/kfd/kfd/topology/nodes/$n
      [ "$(cat "$d/gpu_id")" != 0 ] || continue
      dev=$(printf '%04x' "$(awk '$1 == "device_id" {print $2}' "$d/properties")")
      loc=$(awk '$1 == "location_id" {print $2}' "$d/properties")
      bdf=$(printf '%02x:%02x.%d' $((loc >> 8 & 255)) $((loc >> 3 & 31)) $((loc & 7)))
      if [ "$dev" = {{ (strix_platform.discrete_gpus | first).pci_id.split(':')[1] | quote }} ] && [ -z "$card" ] &&
         { [ -z "$want_bdf" ] || [ "$bdf" = "$want_bdf" ]; }; then card=$i; fi
      if [ "$dev" = {{ strix_platform.gpu_pci_id.split(':')[1] | quote }} ] && [ -z "$apu" ]; then apu=$i; fi
      i=$((i + 1))
    done
    [ -n "$card" ] && [ -n "$apu" ] || { echo "card '${card}' 8060S '${apu}' (strix_xtx_pci '${want_bdf}')" >&2; exit 1; }
    echo "$card $apu"
  args:
    executable: /bin/bash
  register: service_topology_gpus
  changed_when: false
  check_mode: false
  when:
    - strix_system.engine == 'maya'
    - strix_maya.gpu_from_topology | default(false)

- name: Number the engine's GPUs as the host's topology has them
  ansible.builtin.set_fact:
    service_maya_server: >-
      {{ strix_maya.server | combine({'gpu': service_topology_gpus.stdout.split() | map('int') | list}) }}
  when:
    - strix_system.engine == 'maya'
    - strix_maya.gpu_from_topology | default(false)

- name: Install the qualified Maya serving configuration
  ansible.builtin.template:
    src: maya-server.json.j2
    dest: "{{ strix_paths.release }}/server.json"
    owner: root
    group: "{{ strix_service.group }}"
    mode: "0444"
  when: strix_system.engine == 'maya'
  register: service_maya_config
  notify: Restart selected model service

- name: Seal the installed Maya serving configuration
  ansible.builtin.shell: |
    set -o pipefail
    sha256sum server.json > server.sha256
  args:
    chdir: "{{ strix_paths.release }}"
    executable: /bin/bash
  when:
    - strix_system.engine == 'maya'
    - service_maya_config.changed
  changed_when: true

- name: Create the Maya engine's folder for conversations kept on disk
  ansible.builtin.file:
    path: >-
      {{ strix_maya.server.env.MAYA_GLM_SLOT_DIR if (strix_maya.family | default('deepseek')) == 'glm'
         else strix_maya.server.env.MAYA_DS4_SLOT_DIR }}
    state: directory
    owner: "{{ strix_service.user }}"
    group: "{{ strix_service.group }}"
    mode: "0700"
  when: strix_system.engine == 'maya'

- name: Install the Maya runtime entry point and load-time pool drain
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - {src: run-maya.j2, dest: "{{ strix_paths.bin }}/run-maya"}
    - {src: strix-drain-ttm-pool.j2, dest: /usr/local/sbin/strix-drain-ttm-pool}
  loop_control:
    label: "{{ item.dest }}"
  when: strix_system.engine == 'maya'
  notify: Restart selected model service

- name: Install reversible host policy controller
  ansible.builtin.template:
    src: strix-host-policy.j2
    dest: /usr/local/sbin/strix-host-policy
    owner: root
    group: root
    mode: "0755"
  notify: Restart selected model service

- name: Install selected model service service
  ansible.builtin.template:
    src: strix-halo-inference.service.j2
    dest: "/etc/systemd/system/{{ strix_service.name }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart selected model service

- name: Record Ansible-owned qualified release
  ansible.builtin.template:
    src: release.yml.j2
    dest: /etc/strix-halo-inference-release.yml
    owner: root
    group: root
    mode: "0644"

- name: Stop and disable explicitly retired legacy services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ strix_service.retire_units }}"
  failed_when: false

- name: Reload unit files before service activation
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Apply pending model service changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start selected model service
  ansible.builtin.systemd_service:
    name: "{{ strix_service.name }}"
    enabled: "{{ strix_service.auto_start }}"
    state: started

- name: Enable and start demand-based fan governor
  ansible.builtin.systemd_service:
    name: strix-fan-governor.service
    enabled: true
    state: >-
      {{ 'restarted'
         if (fan_governor_program.changed | default(false) or
             fan_governor_unit.changed | default(false))
         else 'started' }}
  when:
    - strix_fan.manage | bool
    - strix_fan.governor.enabled | default(false) | bool
