---
- name: Install the pinned ROCm build dependency set
  ansible.builtin.apt:
    name: "{{ strix_rocm.packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create immutable ROCm build directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ strix_service.group }}"
    mode: "0755"
  loop:
    - "{{ strix_paths.release }}"
    - "{{ strix_paths.release }}/patches"

- name: Install the qualified ROCm patch chain when present
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../patches/{{ item.name }}"
    dest: "{{ strix_paths.release }}/patches/{{ item.name }}"
    owner: root
    group: root
    mode: "0444"
  loop: "{{ strix_rocm.patches }}"
  loop_control:
    label: "{{ item.name }}"
  when: strix_rocm.patches | length > 0

- name: Install the reproducible ROCm build program
  ansible.builtin.template:
    src: build-qualified-rocm.j2
    dest: "{{ strix_paths.bin }}/build-qualified-rocm-{{ strix_release_id }}"
    owner: root
    group: root
    mode: "0755"

- name: Build and test the pinned ROCm runtime
  ansible.builtin.command:
    argv:
      - "{{ strix_paths.bin }}/build-qualified-rocm-{{ strix_release_id }}"
  register: rocm_runtime_build
  changed_when: "'ROCM_RUNTIME_BUILT=1' in rocm_runtime_build.stdout"
  async: 14400
  poll: 30

- name: Report pinned ROCm runtime identity
  ansible.builtin.debug:
    msg: "{{ rocm_runtime_build.stdout_lines }}"
