---
- name: Define pinned RyzenAdj paths
  ansible.builtin.set_fact:
    ryzenadj_source: "{{ strix_paths.source }}/RyzenAdj-{{ strix_ryzenadj.commit }}"
    ryzenadj_binary: "{{ strix_paths.bin }}/ryzenadj-{{ strix_ryzenadj.version }}"

- name: Inspect existing pinned RyzenAdj binary
  ansible.builtin.stat:
    path: "{{ ryzenadj_binary }}"
    checksum_algorithm: sha256
    get_checksum: true
  register: ryzenadj_existing

- name: Fetch exact RyzenAdj source commit
  ansible.builtin.git:
    repo: "{{ strix_ryzenadj.repository }}"
    dest: "{{ ryzenadj_source }}"
    version: "{{ strix_ryzenadj.commit }}"
    single_branch: true
    force: false
  when: >-
    not ryzenadj_existing.stat.exists or
    ryzenadj_existing.stat.checksum != strix_ryzenadj.tested_binary_sha256

- name: Configure the pinned RyzenAdj build
  ansible.builtin.command:
    argv:
      - cmake
      - -S
      - "{{ ryzenadj_source }}"
      - -B
      - "{{ ryzenadj_source }}/build"
      - -DCMAKE_BUILD_TYPE=Release
  changed_when: true
  when: >-
    not ryzenadj_existing.stat.exists or
    ryzenadj_existing.stat.checksum != strix_ryzenadj.tested_binary_sha256

- name: Build the pinned RyzenAdj executable
  ansible.builtin.command:
    argv:
      - cmake
      - --build
      - "{{ ryzenadj_source }}/build"
      - --target
      - ryzenadj
      - "-j{{ ansible_facts.processor_vcpus | default(4) }}"
  changed_when: true
  when: >-
    not ryzenadj_existing.stat.exists or
    ryzenadj_existing.stat.checksum != strix_ryzenadj.tested_binary_sha256

- name: Install the pinned RyzenAdj executable
  ansible.builtin.copy:
    src: "{{ ryzenadj_source }}/build/ryzenadj"
    dest: "{{ ryzenadj_binary }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: >-
    not ryzenadj_existing.stat.exists or
    ryzenadj_existing.stat.checksum != strix_ryzenadj.tested_binary_sha256

- name: Verify installed RyzenAdj identity
  ansible.builtin.stat:
    path: "{{ ryzenadj_binary }}"
    checksum_algorithm: sha256
    get_checksum: true
  register: ryzenadj_installed

- name: Enforce tested RyzenAdj binary when requested
  ansible.builtin.assert:
    that:
      - ryzenadj_installed.stat.exists
      - not strix_ryzenadj.enforce_tested_binary_sha256 | bool or ryzenadj_installed.stat.checksum == strix_ryzenadj.tested_binary_sha256
    fail_msg: >-
      The local toolchain did not reproduce the tested RyzenAdj binary. Refusing
      to apply an unqualified power-control executable.

- name: Verify RyzenAdj can read the SMU table without writing it
  ansible.builtin.command:
    argv: ["{{ ryzenadj_binary }}", --info]
  register: ryzenadj_info
  changed_when: false

- name: Record RyzenAdj provenance
  ansible.builtin.copy:
    dest: /etc/strix-ryzenadj-release
    owner: root
    group: root
    mode: "0644"
    content: |
      repository={{ strix_ryzenadj.repository }}
      commit={{ strix_ryzenadj.commit }}
      kernel={{ ansible_facts.kernel }}
      binary_sha256={{ ryzenadj_installed.stat.checksum }}
