---
- name: Read Maya engine and session allocation
  ansible.builtin.uri:
    url: "http://{{ strix_service.host }}:{{ strix_service.port }}/v1/status"
    return_content: true
  register: verify_maya_status

- name: Verify the qualified Maya serving contract
  ansible.builtin.assert:
    that:
      - verify_health.json.status == 'ok'
      - verify_health.json.max_context | int == strix_service.context | int
      - verify_maya_status.json.service == 'maya'
      - verify_maya_status.json.model == strix_service.alias
      - verify_maya_status.json.context.native | int == strix_service.context | int
      - verify_maya_status.json.concurrency.serving | int == strix_service.parallel_slots | int
    fail_msg: >-
      The live API does not match {{ strix_system.name if (strix_maya.family | default('deepseek')) == 'glm'
      else 'Maya DS4 HIP dual RX 7900 XTX' }}.

- name: Verify sealed Maya runtime artifacts
  ansible.builtin.command:
    argv: [sha256sum, --check, runtime.sha256]
    chdir: "{{ strix_paths.release }}"
  changed_when: false

- name: Verify sealed Maya server configuration
  ansible.builtin.command:
    argv: [sha256sum, --check, server.sha256]
    chdir: "{{ strix_paths.release }}"
  changed_when: false

- name: Define common Maya verification properties
  ansible.builtin.set_fact:
    verify_props:
      json:
        build_info: "Maya {{ verify_maya_status.json.engine }}"
        default_generation_settings:
          n_ctx: "{{ verify_maya_status.json.context.native }}"
