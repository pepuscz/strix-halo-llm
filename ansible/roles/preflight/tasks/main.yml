---
- name: Validate release manifest schema
  ansible.builtin.assert:
    that:
      - strix_release_schema | int == 1
      - strix_release_id | length > 0
      - >-
        strix_system.id in ['vulkan-iq3xxs', 'rocm-rocmfpx', 'strata-qwen-q4xl', 'maya-ds4-dual-xtx',
                            'maya-ds4-gsq-dual-xtx', 'maya-glm-dual-xtx']
      - >-
        strix_system.name in ['Strix Halo llama.cpp Vulkan IQ3_XXS', 'Lucebox ROCm ROCmFPX', 'Strata HIP UD-Q4_K_XL',
                              'Maya DS4 HIP Maya-S IQ2_XXS dual RX 7900 XTX',
                              'Maya DS4 HIP GSQ-RCO IQ2_XS dual RX 7900 XTX',
                              'Maya HIP Maya-M IQ2_S dual RX 7900 XTX']
      - strix_system.engine in ['vulkan', 'rocm', 'strata', 'maya']
      # A Maya release builds one model family; a release without strix_maya.family is DeepSeek.
      - >-
        strix_system.engine != 'maya' or
        (strix_maya.family | default('deepseek')) ==
        {'maya-ds4-dual-xtx': 'deepseek', 'maya-ds4-gsq-dual-xtx': 'deepseek', 'maya-glm-dual-xtx': 'glm'}[strix_system.id]
      - >-
        (strix_system.engine == 'vulkan' and strix_service.context | int == 524288) or
        (strix_system.engine == 'rocm' and strix_service.context | int == 131072) or
        (strix_system.engine == 'maya' and strix_service.context | int == 524288) or
        (strix_system.engine == 'strata' and strix_service.context | int == 262144 and
         strix_service.parallel_slots | int == 4)
      # The large envelope: Strata, and the GLM engine's pinned RAM tier; DeepSeek's mmap regime keeps 118G / 120G.
      - >-
        strix_service.memory_high == ('123G' if strix_system.engine == 'strata' or
        (strix_system.engine == 'maya' and (strix_maya.family | default('deepseek')) == 'glm') else '118G')
      - >-
        strix_service.memory_max == ('125G' if strix_system.engine == 'strata' or
        (strix_system.engine == 'maya' and (strix_maya.family | default('deepseek')) == 'glm') else '120G')
      # A release whose install pins are PENDING never installs (only qualification results may still be pending).
      - >-
        [strix_platform, strix_runtime, strix_target, strix_service, strix_maya | default({})]
        | to_json is not search('"PENDING"')
      - strix_service.memory_swap_max | int == 0
      - strix_service.minimum_effective_non_cma_kib | int >= 2097152
      - strix_target.files | length > 0
      - strix_target.files | map(attribute='size') | map('int') | sum == strix_target.total_size | int
      - strix_service.conflicts | difference(strix_service.retire_units) | length == 0
    fail_msg: The selected release manifest is incomplete or violates its safety envelope.

- name: Read board identity
  ansible.builtin.slurp:
    src: /sys/devices/virtual/dmi/id/board_name
  register: preflight_board_name_raw

- name: Find AMD GPU PCI devices
  ansible.builtin.shell: |
    set -o pipefail
    for device in /sys/class/drm/card*/device; do
      [ -r "$device/vendor" ] || continue
      [ -r "$device/device" ] || continue
      printf '%s:%s\n' "$(sed 's/^0x//' "$device/vendor")" "$(sed 's/^0x//' "$device/device")"
    done | sort -u
  args:
    executable: /bin/bash
  register: preflight_gpu_pci_ids
  changed_when: false
  check_mode: false

- name: Count discrete GPUs the release requires
  ansible.builtin.shell: |
    set -o pipefail
    for device in /sys/bus/pci/devices/*; do
      [ -r "$device/vendor" ] || continue
      printf '%s:%s\n' "$(sed 's/^0x//' "$device/vendor")" "$(sed 's/^0x//' "$device/device")"
    done | grep -cx {{ item.pci_id | quote }} || true
  args:
    executable: /bin/bash
  loop: "{{ strix_platform.discrete_gpus | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: preflight_discrete_gpus
  changed_when: false
  check_mode: false

- name: Require every discrete GPU the release was qualified with
  ansible.builtin.assert:
    that:
      - item.stdout | trim | int == item.item.count | int
    fail_msg: "Expected {{ item.item.count }} x {{ item.item.name }} ({{ item.item.pci_id }}); found {{ item.stdout | trim }}."
  loop: "{{ preflight_discrete_gpus.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Resolve root filesystem free space
  ansible.builtin.set_fact:
    preflight_root_mount: "{{ (ansible_facts.mounts | selectattr('mount', 'equalto', '/') | list | first) }}"

- name: Read the model files already in place at their pinned sizes (an installed or partly installed release)
  ansible.builtin.stat:
    path: "{{ strix_paths.models }}/{{ (item.local_subdirectory + '/') if item.local_subdirectory is defined else '' }}{{ item.name }}"
    get_checksum: false
  loop: "{{ strix_target.files + (strix_extra_artifacts | default([])) }}"
  loop_control:
    label: "{{ item.name }}"
  register: preflight_present_artifacts

- name: Count the files already in place at their pinned sizes (seeds are counted below)
  ansible.builtin.set_fact:
    preflight_present_bytes: "{{ (preflight_present_bytes | default(0) | int) + (item.item.size | int) }}"
  loop: "{{ preflight_present_artifacts.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.stat.exists
    - item.stat.isreg | default(false)
    - item.stat.size | int == item.item.size | int
    - item.item.name not in (strix_artifact_seed_paths | default({}))

- name: Read the converted dense matrices an earlier install wrote beside the model (a release that converts them)
  ansible.builtin.stat:
    path: "{{ strix_paths.models }}/{{ strix_maya.model_subdirectory | default('Maya-S') }}/{{ strix_maya.dense_q8_0.file }}"
    get_checksum: false
  register: preflight_dense_side
  when: strix_maya is defined and strix_maya.dense_q8_0 is defined

- name: Measure the release folder an earlier install already wrote
  ansible.builtin.command:
    argv: [du, -sx, --block-size=1, "{{ strix_paths.release }}"]
  register: preflight_release_du
  changed_when: false
  failed_when: false
  check_mode: false

# The floor is the install's headroom: the model files and the release folder it writes. What is already there - files
# adopted from verified local seeds (hard links use no space), files already in place at their pinned sizes, the
# converted dense matrices at their pinned size and the release folder an earlier install wrote - is discounted, so `verify` and `update` after an install do not demand the
# space that install already used.
- name: Discount what the host already holds of the release
  ansible.builtin.set_fact:
    preflight_required_free_bytes: >-
      {{ [0, strix_platform.minimum_free_bytes | int
          - ((strix_target.files + (strix_extra_artifacts | default([])))
             | selectattr('name', 'in', (strix_artifact_seed_paths | default({})).keys() | list)
             | map(attribute='size') | map('int') | sum)
          - (preflight_present_bytes | default(0) | int)
          - (strix_maya.dense_q8_0.size | int
             if (preflight_dense_side.stat | default({})).size | default(-1) | int
                == strix_maya.dense_q8_0.size | default(-2) | int
             else 0)
          - ((preflight_release_du.stdout | default('0')).split() | first | default('0') | int
             if preflight_release_du.rc | default(1) == 0 else 0)] | max }}

- name: Validate immutable host requirements
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution | lower == strix_platform.os_id
      - ansible_facts.distribution_version == strix_platform.os_version
      - ansible_facts.architecture == strix_platform.architecture
      - ansible_facts.memtotal_mb | int * 1024 >= strix_platform.minimum_memory_kib | int
      - (preflight_board_name_raw.content | b64decode | trim) == strix_platform.board_name
      - strix_platform.gpu_pci_id in preflight_gpu_pci_ids.stdout_lines
      - ansible_facts.swaptotal_mb | int == 0
      - preflight_root_mount.size_available | int >= preflight_required_free_bytes | int
      - not strix_platform.strict_kernel | bool or ansible_facts.kernel == strix_platform.kernel
    fail_msg: >-
      Host identity, kernel, RAM, GPU, swap, or free-space requirements do not match
      the frozen release. Do not weaken the manifest to force an unqualified host.

- name: Read Secure Boot state when mokutil is installed
  ansible.builtin.command:
    argv: [mokutil, --sb-state]
  register: preflight_secure_boot
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require disabled Secure Boot when state is observable
  ansible.builtin.assert:
    that:
      - "'SecureBoot disabled' in preflight_secure_boot.stdout"
    fail_msg: Secure Boot must be disabled before installing the tested AXB35 DKMS module.
  when:
    - strix_platform.secure_boot == 'disabled'
    - preflight_secure_boot.rc == 0

- name: Explain deferred Secure Boot validation
  ansible.builtin.debug:
    msg: mokutil is not installed yet; the platform role will install it and validate Secure Boot.
  when:
    - strix_platform.secure_boot == 'disabled'
    - preflight_secure_boot.rc != 0

- name: Report validated target
  ansible.builtin.debug:
    msg:
      release: "{{ strix_release_id }}"
      host: "{{ inventory_hostname }}"
      board: "{{ preflight_board_name_raw.content | b64decode | trim }}"
      gpu: "{{ preflight_gpu_pci_ids.stdout_lines }}"
      kernel: "{{ ansible_facts.kernel }}"
      memory_mb: "{{ ansible_facts.memtotal_mb }}"
      free_bytes: "{{ preflight_root_mount.size_available }}"
