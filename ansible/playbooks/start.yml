---
- name: Start and verify Strix Halo inference
  hosts: strix_hosts
  become: true
  gather_facts: true
  tasks:
    - name: Start model service
      ansible.builtin.systemd_service:
        name: "{{ strix_service.name }}"
        state: started
        enabled: "{{ strix_service.auto_start }}"
    - name: Verify model service
      ansible.builtin.include_role:
        name: verify
