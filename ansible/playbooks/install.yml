---
- name: Install the selected Strix Halo inference release
  hosts: strix_hosts
  become: true
  gather_facts: true
  serial: 1
  roles:
    - preflight
    - platform
    - ryzenadj
    - fan
    - role: rocm_runtime
      when: strix_system.engine == 'rocm'
    - artifacts
    - role: strata_runtime
      when: strix_system.engine == 'strata'
    - service
    - verify
