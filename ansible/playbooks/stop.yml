---
- name: Stop Strix Halo inference and verify idle cooling
  hosts: strix_hosts
  become: true
  gather_facts: false
  tasks:
    - name: Stop model service
      ansible.builtin.systemd_service:
        name: "{{ strix_service.name }}"
        state: stopped
    - name: Wait for demand-based governor to stop
      ansible.builtin.command:
        argv: [systemctl, is-active, strix-fan-governor.service]
      register: strix_fan_governor_idle
      until: strix_fan_governor_idle.stdout | trim in ['inactive', 'failed', 'unknown']
      retries: 10
      delay: 2
      changed_when: false
      failed_when: false
      when:
        - strix_fan.manage | bool
        - strix_fan.governor.enabled | default(false) | bool
    - name: Wait for fan dependency to stop
      ansible.builtin.command:
        argv: [systemctl, is-active, strix-axb35-max-fan.service]
      register: strix_fan_idle
      until: strix_fan_idle.stdout | trim in ['inactive', 'failed', 'unknown']
      retries: 10
      delay: 2
      changed_when: false
      failed_when: false
      when: strix_fan.manage | bool
    - name: Read fan state
      ansible.builtin.command:
        argv: [/usr/local/sbin/strix-axb35-fan, status]
      register: strix_idle_fans
      changed_when: false
      when: strix_fan.manage | bool
    - name: Assert all fans returned to firmware-auto
      ansible.builtin.assert:
        that:
          - strix_idle_fans.stdout.count('mode=auto') == 3
        fail_msg: Fan dependency stopped without returning all fans to firmware-auto.
      when: strix_fan.manage | bool
    - name: Report stopped state
      ansible.builtin.debug:
        msg: "{{ strix_idle_fans.stdout_lines | default(['model service stopped; external fan backend']) }}"
